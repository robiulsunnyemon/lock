name: Flutter CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # দিনে মোট ১১ বার বিভিন্ন ঘণ্টা ও মিনিটে (~২ ঘণ্টার ব্যবধানে) রান হবে
    - cron: '12 0 * * *'
    - cron: '27 2 * * *'
    - cron: '41 4 * * *'
    - cron: '53 6 * * *'
    - cron: '8 9 * * *'
    - cron: '19 11 * * *'
    - cron: '34 13 * * *'
    - cron: '46 15 * * *'
    - cron: '58 17 * * *'
    - cron: '9 20 * * *'
    - cron: '4 22 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Flutter CI (${{ matrix.job_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: "Android Analyze & Test"
            os: ubuntu-latest
          - job_name: "iOS Environment Check"
            os: macos-latest
          - job_name: "Unit & Widget Tests"
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (No Cache)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Get packages from pub.dev
        run: flutter pub upgrade

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run widget tests
        run: flutter test

name: Flutter CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # দিনে ১১ বার বিভিন্ন ঘণ্টা ও মিনিটে রান হওয়ার জন্য ২টি কম্প্যাক্ট ক্রন রুল
    - cron: '18 0,4,9,13,18,22 * * *'
    - cron: '42 2,6,11,15,20 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Flutter CI (${{ matrix.job_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: "Android Analyze & Test"
            os: ubuntu-latest
          - job_name: "iOS Environment Check"
            os: macos-latest
          - job_name: "Unit & Widget Tests"
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (No Cache)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Get packages from pub.dev
        run: flutter pub upgrade

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run widget tests
        run: flutter test
